name: Reusable - Gradle Release Promote RC to Main

# Reusable workflow that promotes a stabilized RC branch to a tagged release on
# target_main (default `main`). Designed for gradle plugins whose version lives
# in build.gradle as the canonical `version "X-RC-SNAPSHOT"` line (Groovy DSL,
# double-quoted, no equals sign).
#
# Caller side is ~25 lines. See plugin .github/workflows/release-promote.yml
# for the thin caller template.
#
# Behavior:
#   - reads RC_VERSION from build.gradle on rc_branch (must end with -RC-SNAPSHOT)
#   - derives RELEASE_VERSION = RC_VERSION without the -RC-SNAPSHOT suffix
#   - rewrites build.gradle to RELEASE_VERSION in a local commit only; rc_branch on
#     origin stays at -RC-SNAPSHOT, so only target_main's build publishes the release
#   - refuses to release while any tracked Gradle script, gradle.properties or version
#     catalog still names a SNAPSHOT version
#   - merges the finalized RC into target_main with --no-ff -X theirs: every conflicting
#     hunk takes the RC's side, including the previous release's version line. Changes on
#     target_main that never reached the source branch are overwritten where they conflict;
#     checking that they reached it is the release manager's job
#   - tags target_main with RELEASE_VERSION (no `v` prefix; matches monorepo convention)
#     and pushes target_main + tag atomically, so a rejected push changes nothing
#   - optionally dispatches build-publish on target_main

on:
  workflow_call:
    inputs:
      # ──────────── Required ────────────
      rc_branch:
        type: string
        required: true
        description: 'RC branch to promote (e.g. releases/1.6.0-rc).'

      # ──────────── Merge target ────────────
      target_main:
        type: string
        required: false
        default: 'main'
        description: 'Branch to merge the release into (default main).'

      # ──────────── Post-promote dispatch ────────────
      trigger_build:
        type: boolean
        required: false
        default: true
        description: 'After promote, dispatch build-publish on target_main.'
      build_workflow_filename:
        type: string
        required: false
        default: 'build-publish.yml'
        description: 'Filename of the build/publish workflow in the caller repo to dispatch.'

jobs:
  promote:
    runs-on: ubuntu-latest

    # Surfaced as env so the guard below uses the always-available env context
    # rather than relying on secrets being readable from a step-level if.
    env:
      RELEASE_APP_ID: ${{ secrets.XNAT_RELEASE_APP_ID }}

    steps:
      - name: Generate token from GitHub App
        id: app_token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.XNAT_RELEASE_APP_ID }}
          private-key: ${{ secrets.XNAT_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout ${{ inputs.rc_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rc_branch }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Read RC state and derive release version
        id: vars
        env:
          RC_BRANCH: ${{ inputs.rc_branch }}
        run: |
          set -euo pipefail

          RC_VERSION="$(grep -E '^version ' build.gradle | head -n1 | sed -E 's/^version "(.+)"$/\1/')"
          if [[ -z "${RC_VERSION}" ]]; then
            echo "::error::Could not read version from build.gradle (expected 'version \"X\"' Groovy DSL form)"
            exit 1
          fi
          RELEASE_VERSION="${RC_VERSION%-RC-SNAPSHOT}"

          {
            echo "rc_version=${RC_VERSION}"
            echo "release_version=${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::rc=${RC_BRANCH} rc_version=${RC_VERSION} → release=${RELEASE_VERSION}"

      - name: Validate
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          if [[ ! "${RC_BRANCH}" =~ ^releases/.+-rc$ ]]; then
            echo "::error::rc_branch=${RC_BRANCH} must match 'releases/*-rc'"
            exit 1
          fi
          if [[ "${RC_VERSION}" != *-RC-SNAPSHOT ]]; then
            echo "::error::RC branch version=${RC_VERSION} must end with -RC-SNAPSHOT"
            exit 1
          fi
          # rc_branch stays at -RC-SNAPSHOT after its release, so promoting it again (e.g. after
          # a hotfix landed on it) arrives here. Say how to release the hotfix.
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_VERSION}" >/dev/null 2>&1; then
            HINT="the next patch version"
            if [[ "${RELEASE_VERSION}" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
              HINT="\"${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1))-RC-SNAPSHOT\""
            fi
            echo "::error::${RELEASE_VERSION} is already released (tag exists). To ship a patch from ${RC_BRANCH}, set its build.gradle version to ${HINT} and re-run."
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Commits locally only. The next step merges this commit into target_main and pushes
      # that; rc_branch on origin is never updated, so it never holds a release version.
      # Pushing it here published the release twice (once from rc_branch, once from
      # target_main; the loser fails with HTTP 403) and left a failed run un-retryable,
      # because Validate requires rc_branch to still end in -RC-SNAPSHOT.
      - name: Finalize release version (strip -RC-SNAPSHOT, local commit)
        env:
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          sed -i "s|^version \"${RC_VERSION}\"\$|version \"${RELEASE_VERSION}\"|" build.gradle
          grep -E '^version ' build.gradle
          git add build.gradle

          # A release must not depend on a SNAPSHOT (e.g. vXnat = "1.10.1-SNAPSHOT"). The
          # build would publish it anyway, after the tag below is pushed. Stop here instead,
          # before anything is committed, merged or tagged. git grep reads every tracked file
          # of each kind, so subprojects, settings.gradle and buildSrc are covered too.
          #
          # Gradle scripts: only a quoted value ending in -SNAPSHOT counts ("1.2-SNAPSHOT",
          # 'group:name:dev-SNAPSHOT'), so code such as endsWith("-SNAPSHOT") doesn't trip it.
          # Lines starting with // are skipped, but a hit inside /* */ or after a trailing //
          # still fails the run, deliberately: there is no override, because skipping the
          # check is how a SNAPSHOT dependency gets released. Delete the stale comment on
          # the RC branch and re-run.
          SCRIPTS="$(git grep -nE "[\"':][^\"':[:space:]]+-SNAPSHOT[\"']" -- '*.gradle' '*.gradle.kts' \
                     | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)"
          # gradle.properties and version catalogs: any -SNAPSHOT value, in key=value,
          # key: value or key value form. Comment lines (# or !) are skipped.
          PROPS="$(git grep -nE "[^[:space:]=:\"']-SNAPSHOT" -- '*gradle.properties' '*.versions.toml' \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*[#!]' || true)"
          if [[ -n "${SCRIPTS}${PROPS}" ]]; then
            printf '%s\n' "${SCRIPTS}" "${PROPS}" | grep -v '^$'
            echo "::error::Release ${RELEASE_VERSION} still names a SNAPSHOT version (above). Fix the RC branch and re-run."
            exit 1
          fi

          git commit -m "chore(release): finalize ${RELEASE_VERSION}"

      - name: Merge RC into target_main and tag
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          TARGET_MAIN:      ${{ inputs.target_main }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          git fetch origin "${TARGET_MAIN}"
          git switch "${TARGET_MAIN}"
          git pull --ff-only origin "${TARGET_MAIN}"

          # Merges the local rc_branch, which holds the finalize commit (actions/checkout
          # created it with -B). --no-ff gives an explicit merge commit on the release boundary.
          # target_main holds the previous release's finalize commit, which source branches
          # never receive, so its version line conflicts with every later RC: take the RC's
          # side (-X theirs). This applies to every conflicting hunk in every file, not just the
          # version line. A change on target_main that never reached the source branch (e.g. a
          # fix made on an earlier RC) is silently overwritten wherever the RC changed the same
          # lines. Before promoting, the release manager checks that everything on target_main
          # has been merged into the source branch. A conflict git cannot settle alone, such as
          # modify/delete, still fails here, before anything is pushed.
          git merge --no-ff -X theirs "${RC_BRANCH}" -m "release: ${RELEASE_VERSION}"

          git tag "${RELEASE_VERSION}"   # no 'v' prefix (matches monorepo tag convention)
          # Atomic: target_main and the tag land together or not at all. A rejected push
          # (branch protection, a lock) leaves origin as it was, so the run can be re-run.
          git push --atomic origin "${TARGET_MAIN}" "refs/tags/${RELEASE_VERSION}"

      - name: Trigger build/publish on target_main
        # Only needed when pushing as GITHUB_TOKEN, whose pushes GitHub suppresses
        # to prevent recursion. App-token pushes DO trigger build-publish on their
        # own, so dispatching as well would publish the same version twice.
        if: ${{ inputs.trigger_build && steps.app_token.outputs.token == '' }}
        env:
          GH_TOKEN:    ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO:        ${{ github.repository }}
          TARGET_MAIN: ${{ inputs.target_main }}
          BUILD_WORKFLOW: ${{ inputs.build_workflow_filename }}
        run: |
          set -euo pipefail

          echo "::group::Dispatch ${BUILD_WORKFLOW} on target_main (${TARGET_MAIN})"
          gh workflow run "${BUILD_WORKFLOW}" --repo "${REPO}" \
            --ref "${TARGET_MAIN}" \
            -f publish_jfrog=true
          echo "::endgroup::"

      - name: Job summary
        env:
          RC_BRANCH:        ${{ inputs.rc_branch }}
          TARGET_MAIN:      ${{ inputs.target_main }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
          SERVER_URL:       ${{ github.server_url }}
          REPOSITORY:       ${{ github.repository }}
        run: |
          {
            echo "## Release promoted: ${RELEASE_VERSION}"
            echo ""
            echo "**Tag**: [\`${RELEASE_VERSION}\`](${SERVER_URL}/${REPOSITORY}/releases/tag/${RELEASE_VERSION})"
            echo "**${TARGET_MAIN}**: [HEAD](${SERVER_URL}/${REPOSITORY}/tree/${TARGET_MAIN})"
            echo "**${RC_BRANCH}**: unchanged (still -RC-SNAPSHOT; the finalize commit is on ${TARGET_MAIN} only)"
            echo ""
            echo "| file | value |"
            echo "|------|-------|"
            echo "| \`build.gradle\` version | \`${RELEASE_VERSION}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
