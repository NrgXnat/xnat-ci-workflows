name: Reusable - Gradle Release Cut RC Branch

# Reusable workflow that cuts a release-candidate branch from `source_branch`
# and bumps source_branch to the next dev version. Designed for gradle plugins
# whose version lives in build.gradle as the canonical `version "X-SNAPSHOT"`
# line (Groovy DSL, double-quoted, no equals sign — see plugin upgrade
# CHECKLIST §X for the standardized format).
#
# Caller side is ~25 lines. See plugin .github/workflows/release-cut-rc.yml
# for the thin caller template.
#
# Behavior:
#   - reads CURRENT_VERSION from build.gradle (must end with -SNAPSHOT)
#   - cuts `releases/<release>-rc` with version "<release>-RC-SNAPSHOT"
#   - bumps source_branch to <next_dev_version>
#   - pushes both atomically, so a rejected push (e.g. branch protection on
#     source_branch) leaves origin unchanged and the run can be re-run
#   - optionally dispatches build-publish on both new branches

on:
  workflow_call:
    inputs:
      # ──────────── Required ────────────
      next_dev_version:
        type: string
        required: true
        description: 'Version source_branch becomes after cutting (MUST end with -SNAPSHOT)'

      # ──────────── Source branch ────────────
      source_branch:
        type: string
        required: false
        default: 'develop'
        description: 'Branch to cut from. Default develop; some plugins use dev or main.'

      # ──────────── Post-cut dispatch ────────────
      trigger_build:
        type: boolean
        required: false
        default: true
        description: 'After cut, dispatch build-publish on the RC branch and source_branch.'
      build_workflow_filename:
        type: string
        required: false
        default: 'build-publish.yml'
        description: 'Filename of the build/publish workflow in the caller repo to dispatch.'

jobs:
  cut-rc:
    runs-on: ubuntu-latest

    # Surfaced as env so the guard below uses the always-available env context
    # rather than relying on secrets being readable from a step-level if.
    env:
      RELEASE_APP_ID: ${{ secrets.XNAT_RELEASE_APP_ID }}

    steps:
      - name: Generate token from GitHub App
        id: app_token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.XNAT_RELEASE_APP_ID }}
          private-key: ${{ secrets.XNAT_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout ${{ inputs.source_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Read current state and derive versions
        id: vars
        run: |
          set -euo pipefail

          # Standardized Groovy DSL form: `version "1.6.0-SNAPSHOT"`
          CURRENT_VERSION="$(grep -E '^version ' build.gradle | head -n1 | sed -E 's/^version "(.+)"$/\1/')"
          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "::error::Could not read version from build.gradle (expected 'version \"X\"' Groovy DSL form)"
            exit 1
          fi

          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          RC_VERSION="${RELEASE_VERSION}-RC-SNAPSHOT"
          RC_BRANCH="releases/${RELEASE_VERSION}-rc"

          {
            echo "current_version=${CURRENT_VERSION}"
            echo "release_version=${RELEASE_VERSION}"
            echo "rc_version=${RC_VERSION}"
            echo "rc_branch=${RC_BRANCH}"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::source=${{ inputs.source_branch }} current=${CURRENT_VERSION} → rc=${RC_VERSION} branch=${RC_BRANCH}"

      - name: Validate
        env:
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
          CURRENT_VERSION:  ${{ steps.vars.outputs.current_version }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
        run: |
          set -euo pipefail

          if [[ "${CURRENT_VERSION}" != *-SNAPSHOT ]]; then
            echo "::error::source_branch is on ${CURRENT_VERSION}; expected -SNAPSHOT. Refusing to cut RC from a release/RC branch."
            exit 1
          fi
          if [[ "${NEXT_DEV_VERSION}" != *-SNAPSHOT ]]; then
            echo "::error::next_dev_version=${NEXT_DEV_VERSION} must end with -SNAPSHOT"
            exit 1
          fi
          if [[ "${NEXT_DEV_VERSION}" == "${CURRENT_VERSION}" ]]; then
            echo "::error::next_dev_version equals current version (${CURRENT_VERSION}); nothing to bump"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/heads/${RC_BRANCH}" >/dev/null 2>&1; then
            echo "::error::RC branch ${RC_BRANCH} already exists on origin"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # This step and the next commit locally only; the push step after them sends both.
      - name: Cut RC branch (local commit)
        env:
          CURRENT_VERSION:  ${{ steps.vars.outputs.current_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
        run: |
          set -euo pipefail

          git switch -c "${RC_BRANCH}"

          sed -i "s|^version \"${CURRENT_VERSION}\"\$|version \"${RC_VERSION}\"|" build.gradle
          grep -E '^version ' build.gradle
          git add build.gradle

          git commit -m "chore(release): cut RC for ${RELEASE_VERSION}"

      - name: Bump source_branch to next dev version (local commit)
        env:
          SOURCE_BRANCH:    ${{ inputs.source_branch }}
          CURRENT_VERSION:  ${{ steps.vars.outputs.current_version }}
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
        run: |
          set -euo pipefail

          git switch "${SOURCE_BRANCH}"

          sed -i "s|^version \"${CURRENT_VERSION}\"\$|version \"${NEXT_DEV_VERSION}\"|" build.gradle
          grep -E '^version ' build.gradle

          git add build.gradle
          git commit -m "chore(release): bump ${SOURCE_BRANCH} to ${NEXT_DEV_VERSION} after cutting ${RELEASE_VERSION}-rc"

      - name: Push RC branch and source_branch
        env:
          SOURCE_BRANCH:    ${{ inputs.source_branch }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
        run: |
          set -euo pipefail

          # Atomic: both land or neither does. Pushed one at a time, a rejected
          # source_branch push would leave the RC branch behind, and a re-run would
          # then fail Validate because the RC branch already exists.
          git push --atomic origin "${RC_BRANCH}" "${SOURCE_BRANCH}"

      - name: Trigger build/publish on RC branch and source_branch
        # Only needed when pushing as GITHUB_TOKEN, whose pushes GitHub suppresses
        # to prevent recursion. App-token pushes DO trigger build-publish on their
        # own, so dispatching as well would publish the same version twice.
        if: ${{ inputs.trigger_build && steps.app_token.outputs.token == '' }}
        env:
          GH_TOKEN:      ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO:          ${{ github.repository }}
          RC_BRANCH:     ${{ steps.vars.outputs.rc_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          BUILD_WORKFLOW: ${{ inputs.build_workflow_filename }}
        run: |
          set -euo pipefail

          echo "::group::Dispatch ${BUILD_WORKFLOW} on RC branch (${RC_BRANCH})"
          gh workflow run "${BUILD_WORKFLOW}" --repo "${REPO}" \
            --ref "${RC_BRANCH}" \
            -f publish_jfrog=true
          echo "::endgroup::"

          echo "::group::Dispatch ${BUILD_WORKFLOW} on source_branch (${SOURCE_BRANCH})"
          gh workflow run "${BUILD_WORKFLOW}" --repo "${REPO}" \
            --ref "${SOURCE_BRANCH}" \
            -f publish_jfrog=true
          echo "::endgroup::"

      - name: Job summary
        env:
          SOURCE_BRANCH:    ${{ inputs.source_branch }}
          NEXT_DEV_VERSION: ${{ inputs.next_dev_version }}
          RC_BRANCH:        ${{ steps.vars.outputs.rc_branch }}
          RC_VERSION:       ${{ steps.vars.outputs.rc_version }}
          RELEASE_VERSION:  ${{ steps.vars.outputs.release_version }}
          SERVER_URL:       ${{ github.server_url }}
          REPOSITORY:       ${{ github.repository }}
        run: |
          {
            echo "## Release RC cut: ${RELEASE_VERSION}"
            echo ""
            echo "**RC branch**: [\`${RC_BRANCH}\`](${SERVER_URL}/${REPOSITORY}/tree/${RC_BRANCH})"
            echo ""
            echo "| file | value |"
            echo "|------|-------|"
            echo "| \`build.gradle\` version | \`${RC_VERSION}\` |"
            echo ""
            echo "**${SOURCE_BRANCH}** bumped to: \`${NEXT_DEV_VERSION}\`"
            echo ""
            echo "### Next step"
            echo "Stabilize on \`${RC_BRANCH}\`; when ready, dispatch the release-promote workflow."
          } >> "$GITHUB_STEP_SUMMARY"
